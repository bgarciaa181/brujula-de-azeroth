# Actualiza las noticias cada 3 horas y sube los cambios al repositorio
name: Actualizar noticias

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas (minuto 17, hora UTC)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar noticias
        run: python scripts/noticias.py

      - name: Guardar cambios si hay noticias nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          git diff --cached --quiet || git commit -m "Noticias actualizadas"
          git push
